
name: Update Global Visitors

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: update-global-visitors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1033000545220/locations/global/workloadIdentityPools/github-analytics-pool/providers/github-actions
          service_account: ga4-global-visitors@kpsannis-global-visitors.iam.gserviceaccount.com

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-analytics-data google-auth

      - name: Fetch real GA4 visitors
        env:
          GA4_PROPERTY_ID: "326431794"
        run: python scripts/update_visitors.py

      - name: Publish updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/visitors.json
          if ! git diff --cached --quiet; then
            git commit -m "Update GA4 country visitors"
            git push
          fi
